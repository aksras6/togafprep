<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOGAF Prep — Akshat's Certification Hub</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="app-shell">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="brand-icon">⬡</span>
        <div class="brand-text">
          <span class="brand-name">TOGAF Prep</span>
          <span class="brand-sub">Certification Hub</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Primary navigation">
        <a href="#/" class="nav-link" data-route="/">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#/modules" class="nav-link" data-route="/modules">
          <span class="nav-icon">◫</span>
          <span class="nav-label">Modules</span>
        </a>
        <a href="#/practice" class="nav-link" data-route="/practice">
          <span class="nav-icon">◎</span>
          <span class="nav-label">Practice</span>
        </a>
        <a href="#/exams" class="nav-link" data-route="/exams">
          <span class="nav-icon">◉</span>
          <span class="nav-label">Exams</span>
        </a>
        <a href="#/glossary" class="nav-link" data-route="/glossary">
          <span class="nav-icon">◷</span>
          <span class="nav-label">Glossary</span>
        </a>

        <div class="nav-divider"></div>

        <a href="#/settings" class="nav-link" data-route="/settings">
          <span class="nav-icon">◌</span>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="streak-badge" id="streak-badge">
          <span class="streak-flame">🔥</span>
          <span class="streak-count" id="streak-count">0</span>
          <span class="streak-label">day streak</span>
        </div>
      </div>
    </aside>

    <!-- MOBILE HEADER -->
    <header id="mobile-header" class="mobile-header">
      <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <span class="mobile-brand">⬡ TOGAF Prep</span>
      <div class="mobile-streak">
        <span>🔥</span>
        <span id="mobile-streak-count">0</span>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="main-content" role="main" aria-live="polite">
      <div id="page-container" class="page-container">
        <!-- Pages render here -->
        <div class="loading-state">
          <div class="loader-ring"></div>
          <p>Loading…</p>
        </div>
      </div>
    </main>

  </div>

  <!-- Overlay for mobile sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
